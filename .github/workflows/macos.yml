name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  GLKVM_TEST_LOCK: ${{ secrets.GLKVM_TEST_LOCK }}
permissions:
  contents: read
concurrency:
  group: glkvm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  test:
    name: macOS checks
    if: >-
      github.repository == 'layernine-dev/glkvm' &&
      (github.actor == 'keeperxy' || github.actor == 'uwe-schwarz') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.user.login == 'keeperxy' ||
       github.event.pull_request.user.login == 'uwe-schwarz')
    runs-on: [self-hosted, macOS, ARM64, glkvm-macos]
    timeout-minutes: 60
    steps:
      - name: Mask runner-local paths
        shell: zsh "{0}"
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests in the shared macOS slot
        shell: zsh "{0}"
        run: |
          # Fork PRs have no repository secrets; use the runner-local setting.
          if [[ -z "$GLKVM_TEST_LOCK" && -f "$HOME/.config/glkvm/ci.env" ]]; then
            source "$HOME/.config/glkvm/ci.env"
          fi
          : "${GLKVM_TEST_LOCK:?Configure the runner lock path repository secret}"
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          export PATH="$HOME/.bun/bin:$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          caffeinate -d -i -u python3 "$GLKVM_TEST_LOCK" /bin/zsh -e -c '
            eval "$(fnm env --shell zsh)"
            bun install --frozen-lockfile
            bun run check
            bun run test
            bun run test:gui
            bun run build
            bun run licenses:check
          '
  release:
    name: Publish release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, glkvm-macos]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Mask runner-local paths
        shell: zsh "{0}"
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, notarize and publish the tested commit
        shell: zsh "{0}"
        env:
          GH_TOKEN: ${{ github.token }}
          GLKVM_RELEASE_SIGNING_IDENTITY: ${{ vars.GLKVM_RELEASE_SIGNING_IDENTITY }}
          GLKVM_NOTARY_PROFILE: ${{ vars.GLKVM_NOTARY_PROFILE }}
        run: |
          : "${GLKVM_TEST_LOCK:?Configure the runner lock path repository secret}"
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          export PATH="$HOME/.bun/bin:$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          caffeinate -d -i -u python3 "$GLKVM_TEST_LOCK" /bin/zsh -e -c '
            eval "$(fnm env --shell zsh)"
            bun install --frozen-lockfile
            release_status=0
            node scripts/release.cjs published || release_status=$?
            if [ "$release_status" -eq 0 ]; then exit 0; fi
            if [ "$release_status" -ne 2 ]; then exit "$release_status"; fi
            bun run build:release
            bun run release:publish
          '

name: Neo macOS tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, neo]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Run tests in the shared Neo slot
        shell: zsh "{0}"
        run: |
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          export PATH="$HOME/.bun/bin:$HOME/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          python3 "$HOME/dev/my/macos/scripts/neo-test-lock.py" /bin/zsh -e -c '
            eval "$(fnm env --shell zsh)"
            bun install --frozen-lockfile
            bun run check
            bun run test
            bun run test:gui
          '
